%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Turbulent flow over flat plate with zero pressure gradient %
% Author: Thomas D. Economon                                                   %
% Institution: Stanford University                                             %
% Date: 2011.11.10                                                             %
% File Version 5.0.0 "Raven"                                                %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
% Physical governing equations (EULER, NAVIER_STOKES,
%                               WAVE_EQUATION, HEAT_EQUATION, FEM_ELASTICITY,
%                               POISSON_EQUATION)
SOLVER= RANS
%
% If Navier-Stokes, kind of turbulent model (NONE, SA, SA_NEG, SST)
KIND_TURB_MODEL= SST
%
% Mathematical problem (DIRECT, CONTINUOUS_ADJOINT)

%
% Restart solution (NO, YES)
RESTART_SOL= NO

% ----------- COMPRESSIBLE AND INCOMPRESSIBLE FREE-STREAM DEFINITION ----------%
%
% Mach number (non-dimensional, based on the free-stream values)

MACH_NUMBER= 1E-9
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= 101325
FREESTREAM_TEMPERATURE= 300
REF_DIMENSIONALIZATION= DIMENSIONAL

FLUID_MODEL= STANDARD_AIR
% --------------------------- VISCOSITY MODEL ---------------------------------%
%
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.716E-5

CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
PRANDTL_TURB= 0.90

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
% Navier-Stokes wall boundary marker(s) (NONE = no marker)
MARKER_HEATFLUX= ( wall, 0.0 )
%
% Mass Flow: (inlet marker, density, velocity magnitude, flow_direction_x,
% flow_direction_y, flow_direction_z, ... ) wINLET_TYPE= MASS_FLOW
% MARKER_INLET= ( inlet, 1.225, 50, 1.0, 0.0, 0.0 )
 MARKER_OUTLET= ( outlet, 101325, farfield, 101325 )


INLET_TYPE= TOTAL_CONDITIONS
MARKER_INLET= ( inlet, 300, 154490, 1, 0, 0 )

%
% Symmetry boundary marker(s) (NONE = no marker)
MARKER_SYM= ( symmetric )
MARKER_INTERNAL= ( internal )
%
% Marker(s) of the surface to be plotted or designed
MARKER_PLOTTING= ( wall )
%


% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%

CFL_NUMBER= 1.0
%
% Adaptive CFL number (NO, YES)
CFL_ADAPT= YES
%
% Parameters of the adaptive CFL number (factor down, factor up, CFL min value,

NUM_METHOD_GRAD= GREEN_GAUSS
CFL_ADAPT_PARAM= ( 0.1, 2.0, 100.0, 1e5 )


% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= NONE


% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-3
LINEAR_SOLVER_ITER= 5

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.02 )
ENTROPY_FIX_COEFF= 0.1
TIME_DISCRE_FLOW= EULER_IMPLICIT

% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
%
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_REDUCTION_TURB= 1.0
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
ITER= 3000
CONV_RESIDUAL_MINVAL= -12
CONV_STARTITER= 10

% -------------------- OUTPUT -------------------------------------------------%
MARKER_ANALYZE= ( inlet, outlet )
MARKER_MONITORING= ( wall )
MESH_FILENAME= fine5_sym.su2
TABULAR_FORMAT= CSV
SOLUTION_FILENAME= restart
OUTPUT_WRT_FREQ= 10
SCREEN_OUTPUT= INNER_ITER, RMS_DENSITY, RMS_MOMENTUM-X, RMS_ENERGY, SOUND_SPEED
VOLUME_OUTPUT= PRIMITIVE
HISTORY_OUTPUT= ITER, RMS_RES, FLOW_COEFF
OUTPUT_FILES= (RESTART, PARAVIEW_ASCII, SURFACE_PARAVIEW_ASCII)
